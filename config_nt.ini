# Batch job test configuration converted from ../test/config_nt.yaml
# This file uses batch job submission via mk2025a package

[main]
# Batch job mode - this triggers the use of mk2025a for job submission
useBatch = True
setupFromFolder = /home/agray/src/cas/quokka/final
virtualEnvironment = /home/agray/src/cas/quokka/venv

# HPC configuration
cluster = NT
scheduler = slurm
gpu_build = cuda
shell = /bin/bash

# Paths configuration
working_dir = ./
environment = env_setup_ucx.sh
test_inputs = ./tests_input

# Global job settings
ntasks_per_node = 4
mem_per_node = 4G

# Scaling configuration
scaling_strategy = weak_3d
min_cores = 1
max_cores = 10

# Test definition
[test_hydro3d_blast]
name = test_hydro3d_blast
target = HydroBlast3D/test_hydro3d_blast
inputFile = blast_32.in

# CMake cache settings
cmake_cache = -DCMAKE_BUILD_TYPE=Release -DQUOKKA_PYTHON=OFF -DAMReX_SPACEDIM=3

# Job-specific settings
walltime = 00:10:00
mem_per_node = 4G
