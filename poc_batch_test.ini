[main]
# Test directory settings
testTopDir = /home/agray/src/cas/quokka/regression_testing
webTopDir  = /home/agray/src/cas/quokka/regression_testing/web

# Create web directory if it doesn't exist
# Or use an existing temp directory
# webTopDir = /tmp/regression_web

# mk2025a path for batch job support
mk2025aPath = ../mk2025a

sourceTree = C_Src
useCmake = 1
isSuperbuild = 1
numMakeJobs = 4
updateGitSubmodules = 1

plot_file_name = plotfile_prefix
check_file_name = checkpoint_prefix

# don't compress output plotfiles
archive_output = 0
# delete plotfiles after compare
purge_output = 1

# suiteName is the name prepended to all output directories
suiteName = quokka_poc

reportActiveTestsOnly = 1
default_branch = development

# email settings (disabled for POC)
sendEmailWhenFail = 0

# slack settings (disabled for POC)
slack_post = 0

# MPI settings
MPIcommand = mpirun -n @nprocs@ @command@
MPIhost =

[AMReX]
# For POC, use quokka's amrex submodule
dir = /home/agray/src/cas/quokka/quokka/subprojects/amrex
branch = development

[source]
dir = /home/agray/src/cas/quokka/quokka
branch = development

# POC batch job test - HydroWave
[HydroWave-BatchPOC]
buildDir = .
target = test_hydro2d_wave
inputFile = tests/hydro_wave.in
dim = 2
# Enable batch job execution
useBatch = 1
# Optional: specify custom mk2025a config (will use defaults if not specified)
# batchConfig = hydro_wave_batch.yaml
restartTest = 0
useMPI = 1
numprocs = 1
compileTest = 0
doVis = 0
testSrcTree = .
ignore_return_code = 1
# Don't do comparison for POC
doComparison = 0

# Regular test (non-batch) for comparison
[HydroWave-Local]
buildDir = .
target = test_hydro2d_wave  
inputFile = tests/hydro_wave.in
dim = 2
useBatch = 0
restartTest = 0
useMPI = 1
numprocs = 1
compileTest = 0
doVis = 0
testSrcTree = .
ignore_return_code = 1
doComparison = 0